site_name: Веб-программирование. Андреевский Иван. К3339
 
theme:
  name: material
  language: ru
  features:
    - content.code.copy
    - navigation.sections
    - toc.integrate
 
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
 
nav:
  - Главная: index.md
  - ЛР1:
      - Отчёт: lr1/report.md